# CampusYamu — the backend in Docker, using your own Neo4j (e.g. Neo4j Desktop on this machine)
#
#   make docker-backend     load your Neo4j from data/, start the API, wait until healthy
#                           -> API http://127.0.0.1:8780 (docs /docs, OpenAPI /openapi.json)
#   make docker-demo        the same plus the built-in web page on http://127.0.0.1:8770
#
# Without make (same steps):
#   docker compose build api
#   docker compose run --rm seed          # load the graph, travel times, handbook search into Neo4j
#   docker compose up -d --wait api
#   docker compose logs -f api | docker compose --profile web down
#
# Keys come from .env (see .env.example); nothing secret is baked into the image. Neo4j:
# NEO4J_URI_DOCKER (default bolt://host.docker.internal:7687 = Neo4j Desktop on this machine),
# NEO4J_PASSWORD, NEO4J_DATABASE. Start the instance before the backend. `seed` makes no API
# calls and is safe to re-run (each step replaces only its own nodes).

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: campusyamu-web
  env_file:
    - .env
  environment:
    CAMPUSYAMU_HOME: /app
    NEO4J_URI: ${NEO4J_URI_DOCKER:-bolt://host.docker.internal:7687}
  extra_hosts:
    - "host.docker.internal:host-gateway"   # Linux; Docker Desktop (Mac, Windows) has it already
  volumes:
    - ./config:/app/config:ro            # edit settings.yaml without rebuilding (restart the container)
    - ./data/cache:/app/data/cache        # career and university research survives restarts
    - ./data/memory:/app/data/memory      # chat memory when SUPABASE_DB_URL is not set
    - ./outputs:/app/outputs

services:
  api:                                    # the backend: every /v1 endpoint
    <<: *app
    command: ["uv", "run", "--no-sync", "python", "-m", "campusyamu.api", "--host", "0.0.0.0", "--port", "8780"]
    ports:
      - "8780:8780"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24
    restart: unless-stopped

  web:                                    # the React frontend (serves frontend/dist + /config.js)
    <<: *app
    depends_on:
      api:
        condition: service_healthy
    environment:
      CAMPUSYAMU_HOME: /app
      NEO4J_URI: ${NEO4J_URI_DOCKER:-bolt://host.docker.internal:7687}
      CAMPUSYAMU_API_BASE_URL: ${CAMPUSYAMU_API_BASE_URL:-http://127.0.0.1:8780}
    ports:
      - "8770:8770"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/config.js', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  seed:                                   # one-off: docker compose run --rm seed
    <<: *app
    profiles: ["seed"]
    command: ["uv", "run", "--no-sync", "python", "-m", "campusyamu.neo4j_seed"]
    restart: "no"
