<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusYamu</title>
  <meta name="theme-color" content="#FAF9FF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0E2B" media="(prefers-color-scheme: dark)" />
  <!-- apply a saved Light/Dark choice before the page paints, so there is no flash -->
  <script>try { var th = localStorage.getItem("cy.theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Noto+Sans+Sinhala:wght@400..800&family=Noto+Sans+Tamil:wght@400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/brand/logo-mark.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
