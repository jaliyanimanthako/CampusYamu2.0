[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campusyamu-agents"
version = "0.3.0"
description = "Modular Z-score and career-trend agents for CampusYamu"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.26",
    "networkx>=3.3",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
]

[project.scripts]
campus-zscore-agent = "zscore_agent.cli:main"
campus-career-trends = "career_trends_agent.cli:main"
campus-career-analysis = "career_trends_agent.analysis_cli:main"
campus-career-swot = "career_trends_agent.pipeline_cli:main"
campus-travel = "travel_time_agent.cli:main"

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
include = ["zscore_agent*", "career_trends_agent*", "travel_time_agent*"]

[tool.setuptools.data-files]
"share/campusselection" = ["data/z_scores.db", "data/travel_times.db"]
