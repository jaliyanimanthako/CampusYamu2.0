[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campusyamu"
version = "0.4.0"
description = "CampusYamu: admissions advisor for Sri Lankan state universities (UGC 2024/2025 handbook)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=1.0",
    "neo4j>=5.26",
    "networkx>=3.3",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0",
]

[project.scripts]
# student-facing
campusyamu-web = "campusyamu.web.server:main"
campusyamu-api = "campusyamu.api.__main__:main"
campusyamu-student = "campusyamu.pipeline.cli:main"
campusyamu-courses = "campusyamu.agents.course_finder.cli:main"
# individual agents
campus-zscore-agent = "campusyamu.agents.zscore.cli:main"
campus-travel = "campusyamu.agents.travel_time.cli:main"
campus-career-trends = "campusyamu.agents.career_trends.cli:main"
campus-career-analysis = "campusyamu.agents.career_trends.analysis_cli:main"
campus-career-swot = "campusyamu.agents.career_trends.pipeline_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["campusyamu*"]

[tool.setuptools.package-data]
"campusyamu.web" = ["static/*"]
"campusyamu.knowledge_graph" = ["templates/*", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
