[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campusyamu-agents"
version = "0.3.0"
description = "Modular Z-score and career-trend agents for CampusYamu"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
campus-zscore-agent = "zscore_agent.cli:main"

[tool.setuptools.packages.find]
include = ["zscore_agent*", "career_trends_agent*"]

[tool.setuptools.data-files]
"share/campusselection" = ["data/z_scores.db"]
