# CampusYamu settings: tunable numbers and defaults, kept out of the code.
# Secrets (API keys, Neo4j password) live only in .env. Model names here are
# defaults; the environment variable named next to each one wins when set.
# Changing a value takes effect on the next run (restart the web app).

ranking:
  suggestions: 20              # entries per suggestion list
  cutoff_weight: 2.5           # order 2/3: preference mark + cutoff_weight x last-year cut-off
  distance_mode: equal         # order 3: "equal" (distance spread = cut-off spread) or "fixed"
  distance_weight: -2.0        # fixed mode: distance_weight x car minutes / distance_scale_min
  distance_scale_min: 540

what_if:                       # order-3 sensitivity analysis
  nudge: 1.5                   # "matters more" = this factor on one score part
  notable_move: 3              # places
  safe_top: 10                 # "stays in your top N whatever you prioritise"
  close_gap: 0.15              # score points between neighbours for a near tie

preferences:
  engine: gemini_decision              # AI that reads the interests ("Use AI"): openai | gemini_decision
                               #   openai: gpt-4o-mini writes every mark (20-40 s); needs OPENAI_API_KEY
                               #   gemini_decision: gemini-decision-1 scores them (fast); needs GEMINI_API_KEY
                               #   PREFERENCE_ENGINE in .env wins. Either one falls back to keyword matching.
  decision_second_category_min: 0.25   # gemini_decision: keep a 2nd category from this probability
  decision_named_course_min: 0.6       # gemini_decision: treat a programme as named from this probability
  min_mark: 5                  # list a course under an interest from this match mark
  rank_weights: [1.0, 0.9, 0.8, 0.7]   # 1st, 2nd, 3rd, 4th interest; later ones use last_weight
  last_weight: 0.6
  poor_fit: -5                 # preference score at or below this = far from every interest
  second_category_weight: 0.85 # offline marks: an interest's second category counts this much

models:                        # every model the app uses (set here only, not in .env); OpenAI unless noted
  preference: gpt-4o-mini      # reads the interests (preferences.engine: openai)
  preference_decision: gemini-decision-1   # reads the interests (engine gemini_decision); Gemini, GEMINI_API_KEY
  feedback: gpt-4o-mini        # advice on the ranked lists
  chat: gpt-4o-mini            # course chat answers
  memory: gpt-4o-mini          # chat memory: follow-up rewrite, summaries, student facts
  guardrail: gemini-decision-1 # course chat scope check; Gemini, GEMINI_API_KEY
  website: gpt-4o-mini         # course research: reads the university pages
  career_analysis: gpt-4o-mini # career research: the cited future SWOT and career extraction
  career_discovery: gpt-4o-mini   # career research: job titles from web pages (can be a cheaper model)
  career_agent: gpt-4o-mini    # career research: the tool-calling research agent
  handbook_extraction: gpt-4o-mini   # offline handbook rule extraction (paid runs, not the API)
  kg_chat: gpt-4o-mini         # graph-viewer chatbot (make kg-chat, not the API)

chat:
  website:                     # university website research for the course chat (sources W, D); web/course_research.py
    enabled: true              # false: the chat's research does careers only and ignores W / D
    max_pages: 5               # pages kept per offering (one search, Tavily or Firecrawl)
    cache_days: 30             # data/cache/university_pages/<uni_code>.json
    passages: 4                # best-fitting passages given to the chat per question
    passage_chars: 900
    max_specialisations: 10    # 2nd hop: one search per specialisation ("Civil Engineering University of Moratuwa")
  search_hits: 4               # extra handbook passages per question (needs Neo4j)
  history_turns: 8             # only without a signed-in student: earlier turns the client sends

guardrail:                     # course chat scope check (web/guardrail.py): only the course + selection process
  enabled: true                # off (or no GEMINI_API_KEY): only the chat prompt's own scope rules apply
  allow_min: 0.4               # refuse when Gemini Decision gives P(in_scope) below this

limits:                        # paid calls per signed-in student per day (api/limits.py); 0 = no limit
  timezone: Asia/Colombo       # when the day resets
  chat: 60                     # course chat questions
  ai_recommendations: 10       # recommendations with use_llm
  research: 3                  # web research runs (careers + university website + specialisations)

memory:                        # course chat memory per signed-in student (campusyamu.memory)
  recent_tokens: 2000          # newest turns sent word for word, newest first, until this many (estimated) tokens
  keep_messages: 8             # newest messages never folded into the summary
  summarize_every: 8           # fold older messages into the running summary once this many are waiting
  facts_every: 5               # look for student facts after this many questions (at once on "remember", "my parents"...)
  max_facts: 30                # per student; the oldest go first
  rewrite_questions: true      # rewrite follow-ups into standalone questions for the handbook search
  db: data/memory/chat_memory.db   # SQLite file, used when SUPABASE_DB_URL is not set

career:
  region: Sri Lanka
  search_provider: ""          # tavily | firecrawl; empty: tavily when TAVILY_API_KEY is set, else firecrawl
  tavily_search_depth: advanced   # advanced = 2 credits per search, better results; basic = 1 credit
  reddit_actor: harshmaur/reddit-scraper   # Apify actor for Reddit (trudax/reddit-scraper-lite also works)
  horizon_years: 5

web:
  host: 127.0.0.1
  port: 8770

api:                           # FastAPI service for the mobile app and other clients (make api)
  host: 127.0.0.1
  port: 8780
  cors_origins: ["*"]         # browser origins allowed to call it; API_CORS_ORIGINS in .env wins
